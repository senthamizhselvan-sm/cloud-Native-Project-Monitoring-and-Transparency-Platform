global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']

  - job_name: 'project-service'
    static_configs:
      - targets: ['project-service:8002']

  - job_name: 'feedback-service'
    static_configs:
      - targets: ['feedback-service:8003']

  - job_name: 'document-service'
    static_configs:
      - targets: ['document-service:8004']

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:8005']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8006']

  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:8007']

  - job_name: 'prediction-service'
    static_configs:
      - targets: ['prediction-service:8008']
